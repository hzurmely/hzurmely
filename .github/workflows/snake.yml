name: frozen snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-ice.svg?color_snake=#e0f7ff&color_dots=#0b1622,#0e3a5c,#1e6fa8,#56b4e9,#bfe9ff
            dist/snake-ice-light.svg?color_snake=#0a3252&color_dots=#eaf6ff,#bfe9ff,#7dd3fc,#38bdf8,#0369a1

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
